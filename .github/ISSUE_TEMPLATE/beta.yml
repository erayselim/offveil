name: Sorun bildir
description: Windows veya Mac'te kurulum, bağlantı ve güncelleme sorunları.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Ne yaşadığınızı ve hangi adımda olduğunu kısaca anlatın.
        Varsa Ayarlar → Destek dosyası kaydet üzerinden aldığınız ZIP'i ekleyin.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - "Windows 64-bit"
        - "Mac — Apple Silicon"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: offveil sürümü
      placeholder: "1.0.0-rc.1 — Ayarlar'da görebilirsiniz"
    validations:
      required: true
  - type: input
    id: system_version
    attributes:
      label: İşletim sistemi ve cihaz
      placeholder: "Windows 11 24H2 x64 / macOS 27.0.1, MacBook Pro M1"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Ne oldu?
      description: Hangi adımları izlediniz, ne bekliyordunuz ve ne oldu?
    validations:
      required: true
  - type: input
    id: isp
    attributes:
      label: İnternet sağlayıcısı (bağlantı sorunuysa)
      placeholder: "Türk Telekom / Superonline / diğer"
  - type: textarea
    id: support
    attributes:
      label: Hata mesajı ve destek dosyası
      description: Tam hata mesajını yazın; destek ZIP'ini veya ekran görüntüsünü buraya sürükleyebilirsiniz.
