name: Bug report
description: Installation, connection or update problems on Windows and Mac.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what happened and at which step.
        If possible, attach a ZIP from Settings → Save a support file.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - "Windows 64-bit"
        - "Mac — Apple Silicon"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: offveil version
      placeholder: "1.0.0-rc.1 (from Settings)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and device
      placeholder: "Windows 11 24H2 x64 / macOS 27.0.1, MacBook Pro M1"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the steps, expected result and actual result.
    validations:
      required: true
  - type: input
    id: isp
    attributes:
      label: Internet provider (for connection problems)
  - type: textarea
    id: support
    attributes:
      label: Error message and support file
      description: Include the exact error. You can drag a support ZIP or screenshot here.
