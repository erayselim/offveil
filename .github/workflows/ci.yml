name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # Apple Silicon core: .github/workflows/ci-darwin.yml (separate check).
  core:
    name: windows-core
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache-dependency-path: |
            offveil-core/go.sum
            offveil-core/tests/tunudp/go.sum
      - name: Test
        working-directory: offveil-core
        run: go test ./...
      - name: Race check engine and network lifecycle
        working-directory: offveil-core
        run: go test -race ./internal/engine ./internal/dns ./internal/capture ./internal/proc ./internal/power ./internal/ipc ./internal/desync ./internal/tunnel ./internal/support ./internal/appservice
      - name: Packet-level UDP reassembly regression
        shell: pwsh
        run: ./scripts/test-tun-udp.ps1
      - name: Fetch pinned sing-box for local UDP integration
        working-directory: offveil-core
        shell: pwsh
        run: ./scripts/fetch-sing-box.ps1
      - name: Validate native routing and opaque UDP round trips
        working-directory: offveil-core
        shell: pwsh
        run: |
          $env:OFFVEIL_SINGBOX_TEST = (Resolve-Path ./third_party/sing-box/sing-box.exe).Path
          go test ./internal/tunnel -run '^TestNative(SingBoxConfig|NetworkUDPRouting|NetworkOpaqueTCPRouting|OpaqueUDPDirectRoundTrip|HijackedDNSUsesCoreStub)$'
      - name: Validate Windows DPI strategies against pinned ByeDPI
        working-directory: offveil-core
        shell: pwsh
        run: |
          ./scripts/fetch-byedpi.ps1
          go run ./cmd/offveil-core check-payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OFFVEIL_BYEDPI_TEST = (Resolve-Path ./third_party/byedpi/ciadpi.exe).Path
          go test ./internal/desync -run '^TestNativeNewStrategiesPreserveVerifiedTLS$'

  ui:
    name: windows-ui
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: offveil-ui/package-lock.json
      - name: Typecheck
        working-directory: offveil-ui
        run: |
          npm ci
          npm run typecheck
          node --test ../scripts/mac-release.test.cjs ../scripts/release.test.cjs ../scripts/status-polling.test.cjs ../scripts/connection-status.test.cjs
