# Apple Silicon prerelease. Isolated from Windows release.yml.
# Tag: v1.0.0-mac.1 (v*-mac*). Never make_latest, never upload latest.json.
# GitHub Latest stays the Windows v* release (ROADMAP.mac.md §7).
name: release-darwin

on:
  push:
    tags:
      - "v*-mac*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      GO_VERSION: "1.25.13"
      NODE_VERSION: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: offveil-core/go.sum

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: offveil-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Test and build core (darwin/arm64)
        working-directory: offveil-core
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go test ./...
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/offveil-core ./cmd/offveil-core

      - name: Fetch sidecars (SHA fail-closed)
        working-directory: offveil-core
        run: |
          set -euo pipefail
          bash ./scripts/fetch-sing-box-darwin-arm64.sh dist
          bash ./scripts/build-byedpi-darwin.sh dist

      - name: Sign ruleset
        env:
          OFFVEIL_RULESET_PRIVATE_KEY: ${{ secrets.OFFVEIL_RULESET_PRIVATE_KEY }}
        working-directory: offveil-core
        run: |
          set -euo pipefail
          if [[ -z "${OFFVEIL_RULESET_PRIVATE_KEY:-}" ]]; then
            echo "OFFVEIL_RULESET_PRIVATE_KEY secret required" >&2
            exit 1
          fi
          go run ./cmd/ruleset-sign --in ../ruleset/active.json --out ../ruleset/active.json.sig

      - name: Install UI deps
        working-directory: offveil-ui
        run: npm ci

      - name: Stage Darwin bundle binaries
        run: bash ./scripts/stage-bundle-darwin.sh

      - name: Tauri build (.app, aarch64-apple-darwin)
        working-directory: offveil-ui
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret required" >&2
            exit 1
          fi
          npm run tauri -- build --target aarch64-apple-darwin --bundles app

      - name: Seal .app, DMG, updater tar.gz
        id: artifacts
        working-directory: offveil-ui
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/*.app
          )
          APP=""
          for c in "${apps[@]}"; do
            if [[ -d "$c" ]]; then APP="$c"; break; fi
          done
          if [[ -z "$APP" ]]; then
            echo "offveil.app not found under src-tauri/target" >&2
            exit 1
          fi
          VER="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          OUT="${GITHUB_WORKSPACE}/dist-release"
          mkdir -p "$OUT"
          DMG="${OUT}/offveil_${VER}_aarch64.dmg"
          TAR="${OUT}/offveil_${VER}_aarch64.app.tar.gz"
          bash "${GITHUB_WORKSPACE}/scripts/darwin-seal-bundle.sh" --app "$APP" --tar "$TAR" --dmg "$DMG"
          npm run tauri -- signer sign "$TAR"
          cp "${GITHUB_WORKSPACE}/ruleset/active.json" "$OUT/"
          cp "${GITHUB_WORKSPACE}/ruleset/active.json.sig" "$OUT/"
          (
            cd "$OUT"
            rm -f SHA256SUMS.txt
            for f in *; do
              [[ -f "$f" ]] || continue
              [[ "$f" == SHA256SUMS.txt ]] && continue
              shasum -a 256 "$f"
            done | tee SHA256SUMS.txt
          )
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"
          echo "dmg=$(basename "$DMG")" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*_aarch64.dmg
            dist-release/SHA256SUMS.txt

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offveil-darwin-arm64
          path: dist-release/
          if-no-files-found: error

      - name: GitHub Release (prerelease, not Latest)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false
          name: offveil ${{ github.ref_name }} (Apple Silicon)
          body_path: .github/release-body-mac.md
          fail_on_unmatched_files: true
          files: |
            dist-release/*_aarch64.dmg
            dist-release/*_aarch64.app.tar.gz
            dist-release/*_aarch64.app.tar.gz.sig
            dist-release/SHA256SUMS.txt
            dist-release/active.json
            dist-release/active.json.sig
