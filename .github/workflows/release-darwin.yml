# Reused by the shared release; legacy Mac-only tags can still stage a preview.
name: release-darwin

on:
  push:
    tags:
      - "v*-mac*"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      GO_VERSION: "1.26.9"
      NODE_VERSION: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            TAG="v$(node -p "require('./offveil-ui/src-tauri/tauri.conf.json').version")"
          fi
          node scripts/mac-release.cjs config "$TAG" "$RUNNER_TEMP/mac-release.json" offveil-ui/src/whats-new.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: offveil-core/go.sum

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: offveil-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: offveil-ui/src-tauri -> target
          shared-key: macos-aarch64

      - name: Test and build core (darwin/arm64)
        working-directory: offveil-core
        env:
          CGO_ENABLED: "0"
          MAC_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          go test ./...
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X github.com/erayselim/offveil/offveil-core/internal/version.Version=${MAC_VERSION}" -o dist/offveil-core ./cmd/offveil-core

      - name: Fetch sidecars (SHA fail-closed)
        working-directory: offveil-core
        run: |
          set -euo pipefail
          bash ./scripts/fetch-sing-box-darwin-arm64.sh dist
          bash ./scripts/build-byedpi-darwin.sh dist
          ./dist/offveil-core check-payload

      - name: Sign ruleset
        env:
          OFFVEIL_RULESET_PRIVATE_KEY: ${{ secrets.OFFVEIL_RULESET_PRIVATE_KEY }}
        working-directory: offveil-core
        run: |
          set -euo pipefail
          if [[ -z "${OFFVEIL_RULESET_PRIVATE_KEY:-}" ]]; then
            echo "OFFVEIL_RULESET_PRIVATE_KEY secret required" >&2
            exit 1
          fi
          go run ./cmd/ruleset-sign --in ../ruleset/active.json --out ../ruleset/active.json.sig

      - name: Install UI deps
        working-directory: offveil-ui
        run: |
          npm ci
          node --test ../scripts/mac-release.test.cjs ../scripts/release.test.cjs ../scripts/status-polling.test.cjs

      - name: Stage Darwin bundle binaries
        run: bash ./scripts/stage-bundle-darwin.sh

      - name: Test the Mac UI and updater
        working-directory: offveil-ui/src-tauri
        run: cargo test

      - name: Tauri build (.app, aarch64-apple-darwin)
        working-directory: offveil-ui
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret required" >&2
            exit 1
          fi
          npm run tauri -- build --target aarch64-apple-darwin --bundles app --config "$RUNNER_TEMP/mac-release.json"

      - name: Seal .app, DMG, updater tar.gz
        id: artifacts
        working-directory: offveil-ui
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MAC_VERSION: ${{ steps.version.outputs.version }}
          MAC_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/*.app
          )
          APP=""
          for c in "${apps[@]}"; do
            if [[ -d "$c" ]]; then APP="$c"; break; fi
          done
          if [[ -z "$APP" ]]; then
            echo "offveil.app not found under src-tauri/target" >&2
            exit 1
          fi
          VER="$MAC_VERSION"
          OUT="${GITHUB_WORKSPACE}/dist-release"
          mkdir -p "$OUT"
          DMG="${OUT}/offveil_${VER}_aarch64.dmg"
          TAR="${OUT}/offveil_${VER}_aarch64.app.tar.gz"
          bash "${GITHUB_WORKSPACE}/scripts/darwin-seal-bundle.sh" --app "$APP" --tar "$TAR" --dmg "$DMG"
          bash "${GITHUB_WORKSPACE}/scripts/darwin-smoke-bundle.sh" "$APP" "$TAR" "$DMG"
          bash "${GITHUB_WORKSPACE}/scripts/darwin-smoke-install.sh" "$APP"
          npm run tauri -- signer sign "$TAR"
          node "${GITHUB_WORKSPACE}/scripts/mac-release.cjs" manifest "$MAC_TAG" "$GITHUB_REPOSITORY" "$TAR" "$OUT/latest-mac.json"
          cp "${GITHUB_WORKSPACE}/docs/install-mac.txt" "$OUT/READ-ME-FIRST.txt"
          cp "${GITHUB_WORKSPACE}/ruleset/active.json" "$OUT/"
          cp "${GITHUB_WORKSPACE}/ruleset/active.json.sig" "$OUT/"
          (
            cd "$OUT"
            rm -f SHA256SUMS.txt
            for f in *; do
              [[ -f "$f" ]] || continue
              [[ "$f" == SHA256SUMS.txt ]] && continue
              shasum -a 256 "$f"
            done | tee SHA256SUMS.txt
          )
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"
          echo "dmg=$(basename "$DMG")" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*_aarch64.dmg
            dist-release/SHA256SUMS.txt

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offveil-darwin-arm64
          path: dist-release/
          if-no-files-found: error

      - name: Stage Mac prerelease
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-mac')
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          draft: true
          prerelease: true
          make_latest: false
          generate_release_notes: false
          name: offveil ${{ github.ref_name }} (Apple Silicon)
          body_path: .github/release-body-mac.md
          fail_on_unmatched_files: true
          files: |
            dist-release/*_aarch64.dmg
            dist-release/*_aarch64.app.tar.gz
            dist-release/*_aarch64.app.tar.gz.sig
            dist-release/SHA256SUMS.txt
            dist-release/active.json
            dist-release/active.json.sig
            dist-release/READ-ME-FIRST.txt
            dist-release/latest-mac.json

      - name: Upload Mac artifacts for the shared release
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-mac')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            dist-release/*_aarch64.dmg
            dist-release/*_aarch64.app.tar.gz
            dist-release/*_aarch64.app.tar.gz.sig
            dist-release/latest-mac.json
