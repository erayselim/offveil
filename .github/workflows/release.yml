name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Both platforms must finish before the shared release is published.
  windows:
    if: ${{ !contains(github.ref_name, '-mac') }}
    runs-on: windows-latest
    env:
      GO_VERSION: "1.26.10"
      NODE_VERSION: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            offveil-core/go.sum
            offveil-core/tests/tunudp/go.sum
            offveil-core/tools/singbox/go.sum

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: offveil-ui/package-lock.json

      - name: Check release versions
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v' + (Get-Content offveil-ui/package.json -Raw | ConvertFrom-Json).version }
          node scripts/release.cjs check $tag
          if ($LASTEXITCODE -ne 0) { throw 'Release version check failed' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: offveil-ui/src-tauri -> target
          shared-key: windows-release

      - name: Fetch or build verified sidecars
        working-directory: offveil-core
        run: |
          ./scripts/fetch-wintun.ps1
          ./scripts/fetch-byedpi.ps1
          ./scripts/fetch-sing-box.ps1

      - name: Test and build core
        working-directory: offveil-core
        run: |
          $ErrorActionPreference = "Stop"
          $env:OFFVEIL_SINGBOX_TEST = (Resolve-Path ./third_party/sing-box/sing-box.exe).Path
          $env:OFFVEIL_BYEDPI_TEST = (Resolve-Path ./third_party/byedpi/ciadpi.exe).Path
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Core vet failed" }
          go build -trimpath -ldflags="-s -w" -o offveil-core.exe ./cmd/offveil-core
          if ($LASTEXITCODE -ne 0) { throw "Core build failed" }
          ./offveil-core.exe check-payload
          if ($LASTEXITCODE -ne 0) { throw 'Native DPI argument check failed' }

      - name: Verify packet-level UDP reassembly
        run: ./scripts/test-tun-udp.ps1

      - name: Sign ruleset
        env:
          OFFVEIL_RULESET_PRIVATE_KEY: ${{ secrets.OFFVEIL_RULESET_PRIVATE_KEY }}
        working-directory: offveil-core
        run: |
          if (-not $env:OFFVEIL_RULESET_PRIVATE_KEY) { throw "OFFVEIL_RULESET_PRIVATE_KEY secret required" }
          go run ./cmd/ruleset-sign --in ../ruleset/active.json --out ../ruleset/active.json.sig

      - name: Stage installer files
        run: ./scripts/stage-bundle.ps1

      - name: Install UI deps
        working-directory: offveil-ui
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "UI dependency installation failed" }
          node --test ../scripts/mac-release.test.cjs ../scripts/release.test.cjs ../scripts/status-polling.test.cjs ../scripts/connection-status.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Release/update tests failed" }
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "UI Rust tests failed" }

      - name: Tauri build (NSIS + updater artifacts)
        working-directory: offveil-ui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis

      - name: Checksums and latest.json
        id: artifacts
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          $nsis = Get-ChildItem -Recurse "offveil-ui/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found" }
          $out = "dist-release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $nsis.FullName $out
          if (Test-Path "$($nsis.FullName).sig") { Copy-Item "$($nsis.FullName).sig" $out }
          Copy-Item ruleset/active.json $out
          Copy-Item ruleset/active.json.sig $out
          Copy-Item offveil-core/third_party/sing-box/sing-box-1.13.14-source.zip $out
          $ver = $env:TAG.TrimStart("v")
          $base = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)"
          # Windows-only platforms. Do not pass -DarwinDir here.
          ./scripts/generate-latest-json.ps1 -NsisDir $out -Version $ver -DownloadBase $base -OutFile "$out/latest.json"
          Get-ChildItem $out -File | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          } | Set-Content -Encoding ascii "$out/SHA256SUMS.txt"
          Get-Content "$out/SHA256SUMS.txt"
          "installer=$($nsis.Name)" >> $env:GITHUB_OUTPUT
          "dir=$out" >> $env:GITHUB_OUTPUT

      - name: Verify clean install and prior-beta upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem dist-release -Filter '*-setup.exe' | Select-Object -First 1
          ./scripts/windows-installer-smoke.ps1 -Installer $installer.FullName -ExpectedVersion ($env:RELEASE_TAG.TrimStart('v'))

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*-setup.exe

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            dist-release/*-setup.exe
            dist-release/*-setup.exe.sig
            dist-release/latest.json
            dist-release/active.json
            dist-release/active.json.sig
            dist-release/sing-box-1.13.14-source.zip

  macos:
    if: ${{ !contains(github.ref_name, '-mac') }}
    uses: ./.github/workflows/release-darwin.yml
    with:
      shared_release: true
    secrets: inherit

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Resolve release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./offveil-ui/package.json').version")"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release
      - name: Verify and assemble the shared release
        run: node scripts/release.cjs prepare "$TAG" "$GITHUB_REPOSITORY" dist-release "$RUNNER_TEMP/release-body.md"
      - name: Save the legacy Windows update pointer
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')
        run: |
          set -euo pipefail
          LEGACY_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          echo "LEGACY_TAG=$LEGACY_TAG" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/legacy-original" "$RUNNER_TEMP/legacy-update"
          gh release download "$LEGACY_TAG" --pattern latest.json --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/legacy-original"
          cp "$RUNNER_TEMP/legacy-original/"* "$RUNNER_TEMP/legacy-update/"
          node scripts/release.cjs bridge "$RUNNER_TEMP/legacy-update" dist-release
      - name: Keep a rollback copy of the legacy metadata
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-update-backup
          path: ${{ runner.temp }}/legacy-original/
          retention-days: 30
      - name: Attest shared checksums
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-release/SHA256SUMS.txt
      - name: Stage complete release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]] || { echo "Release is already published" >&2; exit 1; }
          else
            args=(--verify-tag --draft --latest=false --title "offveil $TAG" --notes-file "$RUNNER_TEMP/release-body.md")
            [[ "$TAG" != *-* ]] || args+=(--prerelease)
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" dist-release/* --clobber
      - name: Publish the shared release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false --notes-file "$RUNNER_TEMP/release-body.md"
            gh release upload "$LEGACY_TAG" "$RUNNER_TEMP/legacy-update/latest.json" "$RUNNER_TEMP/legacy-update/SHA256SUMS.txt" --clobber
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest --notes-file "$RUNNER_TEMP/release-body.md"
          fi
      - name: Verify published updates from supported prior versions
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: node scripts/release.cjs verify-published "$TAG" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/published-release"
      - name: Upload verified preflight packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-preflight
          path: dist-release/
          if-no-files-found: error
