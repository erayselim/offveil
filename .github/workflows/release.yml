name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GO_VERSION: "1.25.0"
      NODE_VERSION: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: offveil-core/go.sum

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: offveil-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Fetch sidecars (SHA fail-closed)
        working-directory: offveil-core
        run: |
          ./scripts/fetch-wintun.ps1
          ./scripts/fetch-byedpi.ps1
          ./scripts/fetch-sing-box.ps1

      - name: Test and build core
        working-directory: offveil-core
        run: |
          go test ./...
          go build -trimpath -ldflags="-s -w" -o offveil-core.exe ./cmd/offveil-core

      - name: Sign ruleset
        env:
          OFFVEIL_RULESET_PRIVATE_KEY: ${{ secrets.OFFVEIL_RULESET_PRIVATE_KEY }}
        working-directory: offveil-core
        run: |
          if (-not $env:OFFVEIL_RULESET_PRIVATE_KEY) { throw "OFFVEIL_RULESET_PRIVATE_KEY secret required" }
          go run ./cmd/ruleset-sign --in ../ruleset/active.json --out ../ruleset/active.json.sig

      - name: Stage installer files
        run: ./scripts/stage-bundle.ps1

      - name: Install UI deps
        working-directory: offveil-ui
        run: npm ci

      - name: Tauri build (NSIS + updater artifacts)
        working-directory: offveil-ui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis

      - name: Checksums and latest.json
        id: artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $nsis = Get-ChildItem -Recurse "offveil-ui/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found" }
          $out = "dist-release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $nsis.FullName $out
          if (Test-Path "$($nsis.FullName).sig") { Copy-Item "$($nsis.FullName).sig" $out }
          Copy-Item ruleset/active.json $out
          Copy-Item ruleset/active.json.sig $out
          $ver = $env:TAG.TrimStart("v")
          $base = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)"
          ./scripts/generate-latest-json.ps1 -NsisDir $out -Version $ver -DownloadBase $base -OutFile "$out/latest.json"
          Get-ChildItem $out -File | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          } | Set-Content -Encoding ascii "$out/SHA256SUMS.txt"
          Get-Content "$out/SHA256SUMS.txt"
          "installer=$($nsis.Name)" >> $env:GITHUB_OUTPUT
          "dir=$out" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*-setup.exe
            dist-release/SHA256SUMS.txt

      - name: GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          draft: false
          generate_release_notes: false
          body_path: .github/release-body.md
          files: |
            dist-release/*-setup.exe
            dist-release/*-setup.exe.sig
            dist-release/SHA256SUMS.txt
            dist-release/latest.json
            dist-release/active.json
            dist-release/active.json.sig

      - name: Refresh ruleset-latest channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ruleset-latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create ruleset-latest --title "ruleset-latest" --notes "Signed ruleset channel. See the latest v* app release for the installer."
          }
          gh release upload ruleset-latest dist-release/active.json dist-release/active.json.sig --clobber
